name: helploop_sdk
description: HelpLoop - Add support messaging to any Flutter app in minutes
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  http: '>=1.2.0 <2.0.0'
  http_parser: '>=4.0.0 <5.0.0'
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: '>=4.0.0 <5.0.0'
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
